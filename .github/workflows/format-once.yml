name: format python sources

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: configurar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar ruff
        run: python -m pip install ruff

      - name: formatar fontes
        run: ruff format *.py tests

      - name: salvar formatação
        run: |
          if git diff --quiet -- '*.py' 'tests/*.py'; then
            echo "os arquivos já estão formatados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.py' tests/*.py
          git commit -m "style: format python sources"
          git push origin HEAD:main
