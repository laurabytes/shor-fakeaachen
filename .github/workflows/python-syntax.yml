name: checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependências de verificação
        run: python -m pip install "numpy>=2.2,<3" ruff

      - name: verificar sintaxe
        run: python -m compileall -q .

      - name: verificar imports e nomes dos arquivos de entrada
        run: ruff check --select F shor_otimizado.py shor_classical.py shor_quantum.py shor_resources.py shor_backends.py tests/test_shor.py

      - name: executar testes
        run: python -m unittest discover -s tests -v
