name: checks

on:
  push:
    branches:
      - main
      - refactor/documentacao-e-validacao
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependência do teste lógico
        run: python -m pip install "numpy>=2.2,<3"

      - name: verificar sintaxe
        run: python -m compileall -q .

      - name: executar teste de fatoração local
        run: python -m unittest discover -s tests -v
